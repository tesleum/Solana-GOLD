    <!-- PWA Setup -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (window.Telegram && window.Telegram.WebApp) {
        try {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
          if (window.Telegram.WebApp.setHeaderColor) window.Telegram.WebApp.setHeaderColor('#000000');
          if (window.Telegram.WebApp.setBackgroundColor) window.Telegram.WebApp.setBackgroundColor('#000000');
        } catch(e) {}
      }
    </script>
  </head>
  <body style="background-color: #000000; color: #ffffff; margin: 0; padding: 0;">
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #000000; font-family: 'Montserrat', sans-serif;">
        <div style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid rgba(212,175,55,0.2); border-top: 3px solid #D4AF37; animation: spin 1s linear infinite; margin-bottom: 24px;"></div>
        <div style="font-size: 20px; font-weight: 700; color: #D4AF37; letter-spacing: 1px; margin-bottom: 8px;">SOLANA GOLD</div>
        <div style="font-size: 13px; color: rgba(255,255,255,0.6);">Loading Protocol Dashboard...</div>
        <style>
          @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
